name: Validate dataset

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate dataset.json against schema.json
        run: npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate -s schema.json -d dataset.json --strict=true -c ajv-formats
      - name: Check unique rule IDs
        run: jq -e '([.rules[].id] | length) == ([.rules[].id] | unique | length)' dataset.json
